[project]
name = "car-api-scraper"
version = "0.1.0"
description = "Car API scraper"
readme = "README.md"
authors = [
    { name = "cd3abhishek", email = "abhishek.srivastava@collegedunia.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.2.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymongo>=4.13,<5",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
]

[project.scripts]
car-api-scraper = "src.cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]
